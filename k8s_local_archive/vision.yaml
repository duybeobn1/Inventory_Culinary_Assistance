apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision
  template:
    metadata:
      labels:
        app: vision
    spec:
      containers:
        - name: vision
          image: culinary-vision:v1 # Image này ta sẽ build ở Milestone 3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          # Cấu hình xin cấp phát GPU từ Kubernetes (khi lên Cloud)
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vision-service
spec:
  selector:
    app: vision
  ports:
    - port: 8002
      targetPort: 8002
