name: Culinary AI CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  # Fixes the Node.js 20 deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: 📦 Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        # Install the specific GenAI library and test tools
        pip install pytest httpx numpy opencv-python-headless
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🧪 Run Unit & Accuracy Tests
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      run: |
        cd backend
        # We use python -m pytest to ensure the current directory is in the path
        python -m pytest test_main.py -v

    - name: 🐳 Build Docker Image
      run: |
        cd backend
        docker build -t culinary-backend:test .