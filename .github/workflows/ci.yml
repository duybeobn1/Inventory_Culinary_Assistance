name: Culinary AI CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Upgrade to v4 for Node.js 24 compatibility
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # Upgrade to v5 for Node.js 24 compatibility
    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Enables caching for faster subsequent runs
        
    - name: 📦 Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure test tools are present even if not in requirements.txt
        pip install pytest httpx 

    - name: 🧪 Run Unit Tests
      run: |
        cd backend
        # Run pytest on the specific test file
        pytest test_main.py

    - name: 🐳 Build Docker Image
      run: |
        cd backend
        # Verify that the Dockerfile remains valid after changes
        docker build -t culinary-backend:test .
